# 省電螢幕工具 設定檔
# 本檔由程式整份重寫。手動修改並存檔後，請從右鍵選單選「重新載入cfg檔」才會生效；
# 程式存檔時會依格式重新產生整份內容與註解，自行加入的註解不會保留。

# ============================================================
#  一般設定
# ============================================================
[General]
# 自動切換總開關（1=開，0=關）
AutoSwitch=1
# 目前模式（填下方某個 [Mode.N] 的 N）
CurrentMode=1
# 滑鼠要移動超過幾個像素才算使用（過濾桌面震動造成的微小位移）
MouseMoveThreshold=10
# 聲音峰值超過多少（0~1）才算有聲音
AudioThreshold=0.005
# 聲音要連續播放幾秒才算一次使用（過濾通知音這類短暫聲音）
AudioSeconds=3
# 1 = 忽略遠端連線軟體送出的滑鼠鍵盤輸入，避免遠端操作時被當成使用
IgnoreRemoteInput=1
# 自動切換時是否跳出通知（1=是，0=否）
ShowNotifications=1
# 開機登入時自動開啟本程式（1=是，0=否）
StartWithWindows=0

# ============================================================
#  舊版切換條件（過渡用）
# ============================================================
# 自動切換開啟時：處於「遊玩」模式且閒置 IdleMinutes 分鐘 → 切換到「省電」模式；
# 處於「省電」模式且偵測到實體滑鼠使用（或持續播放聲音）→ 切換到「遊玩」模式。
# 處於其他模式時不自動切換。之後的版本改由切換條件取代，這一段會被移除。
[LegacySwitch]
# 扮演「遊玩」與「省電」的模式（填 [Mode.N] 的 N；0 = 沒有；兩者都指定時這兩條切換條件才作用）
HomeMode=1
AwayMode=2
# 「遊玩」模式閒置幾分鐘後切換到「省電」模式（也可以從右鍵選單調整）
IdleMinutes=5
# 聲音偵測（1=開啟，也可以從右鍵選單調整）
AudioDetect=1

# ------------------------------------------------------------
#  模式與螢幕設定
#  [Mode.N] 是一個模式，N 為模式的 ID（不會因改名而變）：
#    Name              模式名稱
#    Color             工作列圖示顏色（#RRGGBB）
#    ManualAutoSwitch  手動切換進入此模式時，自動切換要 Keep（維持）、On（開啟）或 Off（關閉）
#    UnlistedMonitors  套用此模式時，接上但下方沒有記錄的螢幕要 Keep（維持現狀）或 Off（關閉）
#  [Mode.N.Monitor.K] 是模式 N 中一台螢幕的螢幕設定，K 只是順序：
#    Monitor      螢幕識別：廠牌/型號/SN:序號（讀不到序號時為 廠牌/型號/PORT:接孔）
#    Name         螢幕名稱（僅供辨識）
#    Enabled      開啟（1）或關閉（0）
#    X, Y         座標，以主螢幕左上角為 (0,0)
#    Width, Height  解析度（未旋轉時的寬、高）
#    RefreshRate  更新率（Hz）
#    Orientation  方向：Landscape（橫向）、Portrait（直向）、LandscapeFlipped（橫向翻轉）、PortraitFlipped（直向翻轉）
#    Primary      主螢幕（1=是）
# ------------------------------------------------------------

# ============================================================
#  模式「預設」
# ============================================================
[Mode.1]
Name=預設
Color=#EB8232
ManualAutoSwitch=Keep
UnlistedMonitors=Keep

# 模式「預設」的螢幕設定：MAG 322URDF
[Mode.1.Monitor.1]
Monitor=MSI/3DD8/PORT:DP1
Name=MAG 322URDF
Enabled=1
X=0
Y=0
Width=3840
Height=2160
RefreshRate=160
Orientation=Landscape
Primary=1

# 模式「預設」的螢幕設定：Wacom DTK168
[Mode.1.Monitor.2]
Monitor=WAC/1090/SN:6EQ21M1002127
Name=Wacom DTK168
Enabled=1
X=-2560
Y=1440
Width=2560
Height=1600
RefreshRate=60
Orientation=Landscape
Primary=0

# 模式「預設」的螢幕設定：XV272U KV
[Mode.1.Monitor.3]
Monitor=ACR/0833/SN:42122003F4203
Name=XV272U KV
Enabled=1
X=-2560
Y=0
Width=2560
Height=1440
RefreshRate=170
Orientation=Landscape
Primary=0

# ============================================================
#  模式「省電」
# ============================================================
[Mode.2]
Name=省電
Color=#3CAA5A
ManualAutoSwitch=Keep
UnlistedMonitors=Keep

# 模式「省電」的螢幕設定：MAG 322URDF
