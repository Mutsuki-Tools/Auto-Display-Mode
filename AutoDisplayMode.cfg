# 省電螢幕工具 設定檔
# 請先從右鍵選單「關閉程式」再修改本檔，否則程式可能會把你的修改覆蓋掉。

# 螢幕切換 bat 的完整路徑
BatPath=C:\multimonitortool-x64\monitormode.bat
# 切換成遊玩模式 / 省電模式時傳給 bat 的參數
HomeArgs=home
AwayArgs=away

# 以下三項由右鍵選單自動維護
AutoMode=1
IdleMinutes=5
LastMode=home

# 進階：聲音偵測（1=開啟），連續有聲音超過幾秒才算使用中，音量門檻（0~1）
AudioDetect=1
AudioSeconds=3
AudioThreshold=0.005
# 進階：省電模式中，滑鼠要移動超過幾個像素才算有動靜（過濾桌面震動造成的微小位移）
MouseMoveThreshold=10
# 進階：1 = 省電模式中忽略遠端連線軟體送出的滑鼠輸入，避免遠端操作時被切回遊玩模式
IgnoreRemoteInput=1
# 自動切換時是否跳出通知
ShowNotifications=1
