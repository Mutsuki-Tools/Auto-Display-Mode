# Auto Display Mode 設定檔
# 本檔由程式整份重寫。手動修改並存檔後，請從右鍵選單選「重新載入 cfg」才會生效；
# 程式存檔時會依格式重新產生整份內容與註解，自行加入的註解不會保留。

# ============================================================
#  一般設定
# ============================================================
[General]
# 自動切換總開關（1=開，0=關）
AutoSwitch=1
# 目前模式（填下方某個 [Mode.N] 的 N）
CurrentMode=1
# 復原模式（填某個一般模式的 N）：最後一個處於過的一般模式，由程式自動更新。
# 程式啟動時目前模式是潛行模式、虛擬螢幕意外消失時，改套用這個模式；不存在時用順序第一個一般模式
RestoreMode=1
# 滑鼠要移動超過幾個像素才算使用（1~1000，過濾桌面震動造成的微小位移）
MouseMoveThreshold=10
# 聲音峰值超過多少（0~1）才算有聲音
AudioThreshold=0.005
# 聲音要連續播放幾秒才算一次使用（1~3600，過濾通知音這類短暫聲音）
AudioSeconds=3
# 1 = 忽略遠端連線軟體送出的鍵盤滑鼠輸入，避免遠端操作時被當成使用
IgnoreRemoteInput=1
# 自動切換時是否跳出通知（1=是，0=否）
ShowNotifications=1
# 開機登入時自動開啟本程式（1=是，0=否）
StartWithWindows=1

# ============================================================
#  切換條件
# ============================================================
# 只檢查來源模式等於目前模式的切換條件，依 [Switch.N] 的 N 由小到大，第一條成立的就切換。
# 自動切換關閉或設定視窗開著時，只檢查 Forced=1 的切換條件。
# 每次切換完成後所有閒置計時歸零，並有 10 秒緩衝期。
#   From           來源模式（填 [Mode.N] 的 N）
#   Condition      Idle（閒置）或 UsageDetected（偵測到使用）
#   IdleTime       閒置多久（正整數，只用於 Idle）
#   IdleUnit       Minutes（分鐘）或 Hours（小時）（只用於 Idle）
#   MouseKeyboard  使用來源「鍵盤滑鼠」（1=選，0=不選）
#   Audio          使用來源「聲音」（1=選，0=不選；聲音要持續 AudioSeconds 秒才算使用）
#   To             目標模式（填 [Mode.N] 的 N，不可與來源模式相同）
#   Forced         強制（1=是，0=否；沒寫時為 0）：即使自動切換關閉、設定視窗開著，這條也照樣生效
#   BuiltIn        內建切換條件（1=是；只有內建切換條件才寫）
# 閒置：所選的使用來源全部都沒有使用，持續 IdleTime。偵測到使用：所選的使用來源任一個出現使用就成立。
# 內建切換條件：每個潛行模式剛好一條，From 是該潛行模式，Condition=UsageDetected、MouseKeyboard=1、Audio=0、Forced=1 固定，
#   To 必須是一般模式，只認實體鍵盤滑鼠（不受 IgnoreRemoteInput 影響）。不符時程式讀取時會修正並提示。
# 例：
#   [Switch.1]
#   From=1
#   Condition=Idle
#   IdleTime=5
#   IdleUnit=Minutes
#   MouseKeyboard=1
#   Audio=1
#   To=2
#   Forced=0

# 切換條件 1：「全開」閒置 5 分鐘（鍵盤滑鼠、聲音）→「潛行FHD」
[Switch.1]
From=1
Condition=Idle
IdleTime=5
IdleUnit=Minutes
MouseKeyboard=1
Audio=1
To=4
Forced=0

# 切換條件 2：「潛行FHD」偵測到使用（鍵盤滑鼠）→「全開」（內建）
[Switch.2]
From=4
Condition=UsageDetected
MouseKeyboard=1
Audio=0
To=1
Forced=1
BuiltIn=1

# 切換條件 3：「潛行2K」偵測到使用（鍵盤滑鼠）→「全開」（內建）
[Switch.3]
From=5
Condition=UsageDetected
MouseKeyboard=1
Audio=0
To=1
Forced=1
BuiltIn=1

# ------------------------------------------------------------
#  模式與螢幕設定
#  [Mode.N] 是一個模式，N 為模式的編號，依模式的順序（改名不變；在設定視窗調整順序或刪除模式並套用後重新編號）：
#    Name              模式名稱
#    Kind              Normal（一般模式）或 Remote（潛行模式：所有螢幕關閉，只開啟虛擬螢幕）；建立後不能改
#    Color             工作列圖示顏色（#RRGGBB）
#    ManualAutoSwitch  手動切換進入此模式時，自動切換要 Keep（維持）、On（開啟）或 Off（關閉）
#    UnlistedMonitors  （一般模式）套用此模式時，接上但下方沒有記錄的螢幕要 Keep（維持現狀）或 Off（關閉）
#    VirtualWidth, VirtualHeight, VirtualRefreshRate  （潛行模式）虛擬螢幕的解析度與更新率
#  潛行模式沒有 UnlistedMonitors 與螢幕設定；每個潛行模式在上方有一條內建切換條件（BuiltIn=1）。
#  [Mode.N.Monitor.K] 是一般模式 N 中一台螢幕的螢幕設定，K 只是順序：
#    Monitor      螢幕識別：廠牌/型號/SN:序號（讀不到序號時為 廠牌/型號/PORT:接孔）
#    Name         螢幕名稱（僅供辨識）
#    Enabled      開啟（1）或關閉（0）
#    X, Y         座標，以主螢幕左上角為 (0,0)
#    Width, Height  解析度（未旋轉時的寬、高）
#    RefreshRate  更新率（Hz）
#    Orientation  方向：Landscape（橫向）、Portrait（直向）、LandscapeFlipped（橫向翻轉）、PortraitFlipped（直向翻轉）
#    Primary      主螢幕（1=是）
# ------------------------------------------------------------

# ============================================================
#  模式「全開」
# ============================================================
[Mode.1]
Name=全開
Kind=Normal
Color=#EB8232
ManualAutoSwitch=Keep
UnlistedMonitors=Keep

# 模式「全開」的螢幕設定：MAG 322URDF
[Mode.1.Monitor.1]
Monitor=MSI/3DD8/PORT:DP1
Name=MAG 322URDF
Enabled=1
X=0
Y=0
Width=3840
Height=2160
RefreshRate=160
Orientation=Landscape
Primary=1

# 模式「全開」的螢幕設定：Wacom DTK168
[Mode.1.Monitor.2]
Monitor=WAC/1090/SN:6EQ21M1002127
Name=Wacom DTK168
Enabled=1
X=-2560
Y=1440
Width=2560
Height=1600
RefreshRate=60
Orientation=Landscape
Primary=0

# 模式「全開」的螢幕設定：XV272U KV
